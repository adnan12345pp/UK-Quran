<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>تعلّم الحروف — Arabic Letter Tracer</title>
<style>
  :root{
    --blue:#003399;
    --blue-dark:#002266;
    --paper:#f4f6fb;
    --card:#ffffff;
    --ink:#1a1a2e;
    --muted:#7a80a0;
    --guide:#c7cde0;
    --good:#1fa15b;
    --bad:#d13b3b;
    --gold:#f2b705;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    background:linear-gradient(180deg,#e7ebf7 0%,var(--paper) 220px);
    font-family:"Segoe UI","Tahoma",-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:18px 12px 40px;
    color:var(--ink);
  }
  .app{
    width:100%;
    max-width:400px;
  }
  .card{
    background:var(--card);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,25,90,0.14);
  }
  header{
    background:linear-gradient(160deg,var(--blue) 0%,var(--blue-dark) 100%);
    color:#fff;
    padding:16px 14px 20px;
    text-align:center;
  }
  .nav-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .nav-btn{
    width:42px;height:42px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,0.16);
    color:#fff;
    font-size:20px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:transform .12s ease, background .15s ease;
  }
  .nav-btn:active{transform:scale(0.9);background:rgba(255,255,255,0.32);}
  .letter-meta{flex:1;}
  .letter-meta .idx{font-size:11px;letter-spacing:1px;color:#c9d3f5;margin-bottom:2px;}
  .letter-meta .names{font-size:14px;color:#e6ebff;}
  .letter-meta .names b{color:#fff;font-weight:600;}
  .big-char{
    font-size:64px;
    line-height:1;
    margin:10px 0 2px;
    font-weight:400;
  }
  .streak-wrap{
    margin-top:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .streak-dot{
    width:11px;height:11px;border-radius:50%;
    background:rgba(255,255,255,0.25);
    transition:background .2s ease, transform .2s ease;
  }
  .streak-dot.filled{background:var(--gold);transform:scale(1.15);}
  .streak-label{
    font-size:11px;color:#c9d3f5;margin-top:8px;letter-spacing:.3px;
  }
  .mode-badge{
    display:inline-block;margin-top:8px;
    padding:4px 12px;border-radius:20px;
    font-size:11px;font-weight:600;letter-spacing:.4px;
  }
  .mode-badge.tracing{background:rgba(255,255,255,0.18);color:#fff;}
  .mode-badge.blank{background:var(--gold);color:#3a2900;}

  .body-area{padding:16px 16px 18px;}
  .instruction{
    text-align:center;
    font-size:13.5px;
    color:var(--muted);
    margin:0 0 12px;
    min-height:18px;
  }
  .canvas-wrap{
    position:relative;
    width:100%;
    border-radius:16px;
    background:
      repeating-linear-gradient(90deg, rgba(0,51,153,0.05) 0 1px, transparent 1px 100%);
    background-color:#fbfcff;
    border:2px solid #e3e7f5;
    touch-action:none;
    overflow:hidden;
  }
  canvas{
    display:block;
    width:100%;
    height:auto;
  }
  .overlay-signal{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    opacity:0;
    transition:opacity .15s ease;
  }
  .overlay-signal.show{opacity:1;}
  .overlay-signal .glyph{
    font-size:78px;
    font-weight:700;
    filter:drop-shadow(0 4px 10px rgba(0,0,0,0.18));
  }
  .overlay-signal.correct .glyph{color:var(--good);}
  .overlay-signal.wrong .glyph{color:var(--bad);}

  .controls{
    display:flex;
    gap:10px;
    margin-top:14px;
  }
  .ctrl-btn{
    flex:1;
    border:none;
    border-radius:14px;
    padding:12px 8px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:transform .1s ease, filter .15s ease;
  }
  .ctrl-btn:active{transform:scale(0.97);}
  .ctrl-btn.clear{
    background:#eef1fb;
    color:var(--blue);
  }
  .ctrl-btn.check{
    background:var(--blue);
    color:#fff;
  }
  .ctrl-btn.clear:hover, .ctrl-btn.check:hover{filter:brightness(1.05);}

  .footnote{
    text-align:center;
    font-size:11px;
    color:#a7acc4;
    margin-top:14px;
    line-height:1.5;
  }

  @media (max-width:360px){
    .big-char{font-size:54px;}
    .overlay-signal .glyph{font-size:64px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <header>
      <div class="nav-row">
        <button class="nav-btn" id="nextBtn" aria-label="التالي" title="Next letter">→</button>
        <div class="letter-meta">
          <div class="idx" id="idxLabel">1 / 28</div>
          <div class="names" id="namesLabel"><b>Alif</b> · ألف</div>
        </div>
        <button class="nav-btn" id="backBtn" aria-label="السابق" title="Previous letter">←</button>
      </div>
      <div class="big-char" id="bigChar">أ</div>
      <div class="mode-badge tracing" id="modeBadge">TRACING MODE</div>
      <div class="streak-wrap" id="streakDots"></div>
      <div class="streak-label" id="streakLabel">0 / 5 correct in a row</div>
    </header>

    <div class="body-area">
      <p class="instruction" id="instructionText">Trace over the dotted guide, starting from the blue dot.</p>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas id="board" width="320" height="240"></canvas>
        <div class="overlay-signal correct" id="signalCorrect"><div class="glyph">✓</div></div>
        <div class="overlay-signal wrong" id="signalWrong"><div class="glyph">✕</div></div>
      </div>
      <div class="controls">
        <button class="ctrl-btn clear" id="clearBtn">Clear</button>
        <button class="ctrl-btn check" id="checkBtn">Check ✓</button>
      </div>
      <p class="footnote">Draw the letter with your finger or mouse. Get 5 correct in a row to unlock Blank Mode — one mistake sends you back to the guided dots.</p>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ---------- geometry helpers ---------- */
  function lerp(a,b,t){ return a + (b-a)*t; }
  function ptOnSeg(seg,t){
    if(seg.p1){
      const x = (1-t)*(1-t)*seg.p0.x + 2*(1-t)*t*seg.p1.x + t*t*seg.p2.x;
      const y = (1-t)*(1-t)*seg.p0.y + 2*(1-t)*t*seg.p1.y + t*t*seg.p2.y;
      return {x,y};
    }
    return { x: lerp(seg.p0.x, seg.p2.x, t), y: lerp(seg.p0.y, seg.p2.y, t) };
  }
  function buildGuide(segments, perSeg){
    perSeg = perSeg || 7;
    const pts = [];
    segments.forEach(seg=>{
      for(let i=0;i<=perSeg;i++){
        pts.push(ptOnSeg(seg, i/perSeg));
      }
    });
    return pts;
  }
  function dist(a,b){ const dx=a.x-b.x, dy=a.y-b.y; return Math.sqrt(dx*dx+dy*dy); }

  /* ---------- shared skeleton families ----------
     Arabic letters cluster into base-shape families that differ only
     by their dots (ba/ta/tha/nun/ya, jeem/haa/khaa, dal/thal, ra/zay,
     seen/sheen, saad/dad, taa/dhaa, ain/ghain, fa/qaf). We reuse the
     base skeleton per family and vary only the diacriticDots, which
     mirrors how the letters are actually taught. */

const BOWL = [
  // Right vertical
  {
    p0: { x: 245, y: 65 },
    p1: { x: 245, y: 85 },
    p2: { x: 245, y: 105 }
  },

  // Right rounded corner
  {
    p0: { x: 245, y: 105 },
    p1: { x: 245, y: 145 },
    p2: { x: 205, y: 150 }
  },

  // Bottom
  {
    p0: { x: 205, y: 150 },
    p1: { x: 160, y: 155 },
    p2: { x: 115, y: 150 }
  },

  // Left rounded corner
  {
    p0: { x: 115, y: 150 },
    p1: { x: 75, y: 145 },
    p2: { x: 75, y: 105 }
  },

  // Left vertical
  {
    p0: { x: 75, y: 105 },
    p1: { x: 75, y: 85 },
    p2: { x: 75, y: 65 }
  }
];
const HOOK = [
  // 1. Top wave header: Starts at the green mark (scaled down, centered)
  {
    p0: { x: 125, y: 75 },
    p1: { x: 165, y: 68 },
    p2: { x: 215, y: 80 }
  },
  // 2. Backtrack corner: Retraces slightly back left to the notch
  {
    p0: { x: 215, y: 80 },
    p1: { x: 200, y: 84 },
    p2: { x: 185, y: 90 }
  },
  // 3. Middle neck diagonal: Sweeps DOWN-LEFT forming the sharp waist
  {
    p0: { x: 185, y: 90 },
    p1: { x: 155, y: 108 },
    p2: { x: 128, y: 140 }
  },
  // 4. Large lower bowl: Compact curve down, around the base, swooping right to the end tip
  {
    p0: { x: 128, y: 140 },
    p1: { x: 105, y: 180 },
    p2: { x: 140, y: 210 }
  },
  {
    p0: { x: 140, y: 210 },
    p1: { x: 175, y: 225 },
    p2: { x: 220, y: 200 }
  }
];
// Arabic Letter Dal (د) defined using quadratic Bézier curve segments
const DAL = [
  {
    p0: { x: 165, y: 75 },
    p1: { x: 205, y: 110 },
    p2: { x: 200, y: 165 }
  },
  {
    p0: { x: 200, y: 165 },
    p1: { x: 165, y: 175 },
    p2: { x: 135, y: 165 }
  }
];
const RA = [
  {
    p0: { x: 190, y: 70 },
    p1: { x: 215, y: 110 },
    p2: { x: 200, y: 150 }
  },
  {
    p0: { x: 200, y: 150 },
    p1: { x: 175, y: 185 },
    p2: { x: 120, y: 180 }
  }
];
const SEEN = [
  // First vertical line (rightmost stroke, goes down)
  {
    p0: { x: 235, y: 70 },
    p1: { x: 235, y: 110 },
    p2: { x: 235, y: 150 }
  },
  // First small bottom curve connecting to second tooth
  {
    p0: { x: 235, y: 150 },
    p1: { x: 215, y: 175 },
    p2: { x: 195, y: 150 }
  },
  // Second tooth going up
  {
    p0: { x: 195, y: 150 },
    p1: { x: 195, y: 130 },
    p2: { x: 195, y: 110 }
  },
  // Second small bottom curve connecting to third tooth
  {
    p0: { x: 195, y: 150 },
    p1: { x: 175, y: 175 },
    p2: { x: 155, y: 150 }
  },
  // Third tooth going up
  {
    p0: { x: 155, y: 150 },
    p1: { x: 155, y: 130 },
    p2: { x: 155, y: 110 }
  },
  // Deep tail curve going down and sweeping left
  {
    p0: { x: 155, y: 150 },
    p1: { x: 155, y: 220 },
    p2: { x: 105, y: 220 }
  },
  // Tail end going straight up on the left
  {
    p0: { x: 105, y: 220 },
    p1: { x: 80, y: 220 },
    p2: { x: 80, y: 145 }
  }
];
const SAAD = [
  // Loop part: starts baseline left, curves up and right, loops down and closes baseline
  {
    p0: { x: 180, y: 150 },
    p1: { x: 200, y: 80 },
    p2: { x: 260, y: 110 }
  },
  {
    p0: { x: 260, y: 110 },
    p1: { x: 270, y: 150 },
    p2: { x: 180, y: 150 }
  },
  // Small tooth after loop going slightly up and down
  {
    p0: { x: 180, y: 150 },
    p1: { x: 160, y: 150 },
    p2: { x: 155, y: 125 }
  },
  // Deep tail bowl going down and sweeping back up on the left
  {
    p0: { x: 155, y: 125 },
    p1: { x: 155, y: 220 },
    p2: { x: 105, y: 220 }
  },
  {
    p0: { x: 105, y: 220 },
    p1: { x: 75, y: 220 },
    p2: { x: 75, y: 145 }
  }
];
const TAA = [
  // 1. Long vertical stem starting from the very top going down
  {
    p0: { x: 160, y: 10 },
    p1: { x: 160, y: 100 },
    p2: { x: 160, y: 190 }
  },
  // 2. Loop starting from base of stem, arching up and right
  {
    p0: { x: 160, y: 190 },
    p1: { x: 180, y: 90 },
    p2: { x: 270, y: 130 }
  },
  // 3. Baseline sweep from right corner, looping flat all the way to the left tip
  {
    p0: { x: 270, y: 130 },
    p1: { x: 280, y: 190 },
    p2: { x: 90, y: 190 }
  }
];
const AIN = [
  // 1. Small top C-shaped loop (opens to the right)
  {
    p0: { x: 215, y: 35 },
    p1: { x: 130, y: 35 },
    p2: { x: 130, y: 100 }
  },
  {
    p0: { x: 130, y: 100 },
    p1: { x: 130, y: 125 },
    p2: { x: 220, y: 105 }
  },
  // 2. Large bottom C-shaped bowl (opens to the right)
  {
    p0: { x: 220, y: 105 },
    p1: { x: 110, y: 135 },
    p2: { x: 110, y: 200 }
  },
  {
    p0: { x: 110, y: 200 },
    p1: { x: 110, y: 245 },
    p2: { x: 250, y: 220 }
  }
];
const FA = [
  // 1. Top head loop (starts inside, curves up, around, and down to meet baseline)
  {
    p0: { x: 225, y: 170 },
    p1: { x: 175, y: 120 },
    p2: { x: 220, y: 100 }
  },
  {
    p0: { x: 220, y: 100 },
    p1: { x: 245, y: 120 },
    p2: { x: 235, y: 155 }
  },
  // 2. Wide flat bottom boat (extends left and curves slightly upward at end)
  {
    p0: { x: 235, y: 155 },
    p1: { x: 200, y: 200 },
    p2: { x: 110, y: 200 }
  },
  {
    p0: { x: 110, y: 200 },
    p1: { x: 80, y: 200 },
    p2: { x: 80, y: 155 }
  },

];
const KAF = [
  // 1. Tall vertical stem starting from the top right
  {
    p0: { x: 230, y: 55 },
    p1: { x: 230, y: 135 },
    p2: { x: 230, y: 190 }
  },
  // 2. Wide baseline sweep running right-to-left
  {
    p0: { x: 230, y: 190 },
    p1: { x: 200, y: 220 },
    p2: { x: 120, y: 220 }
  },
  // 3. Left tip curving slightly upward
  {
    p0: { x: 120, y: 220 },
    p1: { x: 90, y: 220 },
    p2: { x: 90, y: 170 }
  },
  // 4. Inner Mini-Hamza (Top S-loop)
{
    p0: { x: 180, y: 110 },
    p1: { x: 150, y: 95 },
    p2: { x: 145, y: 130 }
  },
  // 2. Middle notch transition (slight curve right)
  {
    p0: { x: 145, y: 130 },
    p1: { x: 150, y: 145 },
    p2: { x: 175, y: 142 }
  },
  // 3. Bottom diagonal tail (sweeps down and left to finish)
  {
    p0: { x: 175, y: 142 },
    p1: { x: 155, y: 162 },
    p2: { x: 135, y: 168 }
  }
];
  const LAM = [
    {p0:{x:195,y:70}, p2:{x:195,y:150}},
    {p0:{x:195,y:150}, p1:{x:185,y:195}, p2:{x:140,y:180}}
  ];
const MEEM = [
  // 1. Loop arch: Starts at the green mark, moves UP-RIGHT over the top crest, then down to the right side
  {
    p0: { x: 155, y: 100 },
    p1: { x: 150, y: 55 },
    p2: { x: 175, y: 48 }
  },
  {
    p0: { x: 175, y: 48 },
    p1: { x: 195, y: 50 },
    p2: { x: 195, y: 100 }
  },
  // 2. Base connector: Sweeps horizontally LEFT back under the head loop
  {
    p0: { x: 195, y: 100 },
    p1: { x: 175, y: 100 },
    p2: { x: 155, y: 100 }
  },
  // 3. Descending tail: Sweeps down-left into the curved vertical tail stroke
  {
    p0: { x: 155, y: 100 },
    p1: { x: 130, y: 115 },
    p2: { x: 130, y: 140 }
  },
  {
    p0: { x: 130, y: 140 },
    p1: { x: 135, y: 175 },
    p2: { x: 150, y: 205 }
  }
];
const HA = [
  // 1. Start at top green mark: curve down-right along outer upper slope to bottom-right corner
  {
    p0: { x: 165, y: 100 },
    p1: { x: 205, y: 105 },
    p2: { x: 220, y: 145 }
  },
  // 2. Bottom curve: sweep down-left around base corner back toward center
  {
    p0: { x: 220, y: 145 },
    p1: { x: 205, y: 170 },
    p2: { x: 165, y: 160 }
  },
  // 3. Inner loop: curve up and around the central counter clockwise/leftwards
  {
    p0: { x: 165, y: 160 },
    p1: { x: 145, y: 135 },
    p2: { x: 160, y: 110 }
  },
  {
    p0: { x: 160, y: 110 },
    p1: { x: 180, y: 110 },
    p2: { x: 175, y: 140 }
  },
  // 4. Outer tail stroke: cross back out through the base and sweep down-left to the end tip
  {
    p0: { x: 175, y: 140 },
    p1: { x: 155, y: 165 },
    p2: { x: 120, y: 180 }
  },
  {
    p0: { x: 120, y: 180 },
    p1: { x: 95, y: 190 },
    p2: { x: 75, y: 195 }
  }
];
const WAW = [
  // 1. Start at blue dot, move horizontally LEFT across the bottom of the loop
  {
    p0: { x: 215, y: 110 },
    p1: { x: 180, y: 115 },
    p2: { x: 145, y: 110 }
  },
  // 2. Curve UP and RIGHT over the top arch of the head
  {
    p0: { x: 145, y: 110 },
    p1: { x: 130, y: 40 },
    p2: { x: 175, y: 35 }
  },
  {
    p0: { x: 175, y: 35 },
    p1: { x: 215, y: 40 },
    p2: { x: 215, y: 110 }
  },
  // 3. Continue DOWNward along the tail swooping down to the bottom-left tip
  {
    p0: { x: 215, y: 110 },
    p1: { x: 215, y: 175 },
    p2: { x: 180, y: 200 }
  },
  {
    p0: { x: 180, y: 200 },
    p1: { x: 145, y: 220 },
    p2: { x: 100, y: 220 }
  }
];
const YAA = [
  // 1. Hook top (starts at right hook tip, arches left over the crest)
  {
    p0: { x: 235, y: 50 },
    p1: { x: 245, y: 40 },
    p2: { x: 200, y: 45 }
  },
  // 2. Middle neck (curves down-left into the deep inner notch)
  {
    p0: { x: 200, y: 45 },
    p1: { x: 155, y: 65 },
    p2: { x: 155, y: 110 }
  },
  // 3. Neck sweep (swings sharply back out to the right)
  {
    p0: { x: 155, y: 110 },
    p1: { x: 165, y: 145 },
    p2: { x: 230, y: 140 }
  },
  // 4. Main bottom bowl (loops around the base to the left side)
  {
    p0: { x: 230, y: 140 },
    p1: { x: 220, y: 220 },
    p2: { x: 115, y: 200 }
  },
  // 5. Left upward tail termination
  {
    p0: { x: 115, y: 200 },
    p1: { x: 75, y: 180 },
    p2: { x: 75, y: 115 }
  },

];
  const ALIF = [{
    p0: { x: 170, y: 15 },
    p1: { x: 152, y: 5 },
    p2: { x: 148, y: 28 }
  },
  // 2. Middle notch transition
  {
    p0: { x: 148, y: 28 },
    p1: { x: 152, y: 38 },
    p2: { x: 168, y: 36 }
  },
  // 3. Bottom diagonal tail
  {
    p0: { x: 168, y: 36 },
    p1: { x: 155, y: 50 },
    p2: { x: 140, y: 54 }
  }, {p0:{x:160,y:80}, p2:{x:160,y:215}} ];

  /* ---------- letters dataset ---------- */
  const RAW_LETTERS = [
    { char:"أ", arName:"ألف", enName:"Alif",  shape:ALIF, dots:[] },
    { char:"ب", arName:"باء", enName:"Ba",    shape:BOWL, dots:[{x:160,y:170}] },
    { char:"ت", arName:"تاء", enName:"Ta",    shape:BOWL, dots:[{x:145,y:85},{x:175,y:85}] },
    { char:"ث", arName:"ثاء", enName:"Tha",   shape:BOWL, dots:[{x:145,y:85},{x:160,y:70},{x:175,y:85}] },
    { char:"ج", arName:"جيم", enName:"Jeem",  shape:HOOK, dots:[{x:163,y:159}] },
    { char:"ح", arName:"حاء", enName:"Haa",   shape:HOOK, dots:[] },
    { char:"خ", arName:"خاء", enName:"Khaa",  shape:HOOK, dots:[{x:167,y:40}] },
    { char:"د", arName:"دال", enName:"Dal",   shape:DAL,  dots:[] },
    { char:"ذ", arName:"ذال", enName:"Thal",  shape:DAL,  dots:[{x:160,y:50}] },
    { char:"ر", arName:"راء", enName:"Ra",    shape:RA,   dots:[] },
    { char:"ز", arName:"زاي", enName:"Zay",   shape:RA,   dots:[{x:182,y:48}] },
    { char:"س", arName:"سين", enName:"Seen",  shape:SEEN, dots:[] },
    { char:"ش", arName:"شين", enName:"Sheen", shape:SEEN, dots:[{x:175,y:70},{x:190,y:55},{x:205,y:70}]  },
    { char:"ص", arName:"صاد", enName:"Saad",  shape:SAAD, dots:[] },
    { char:"ض", arName:"ضاد", enName:"Dad",   shape:SAAD, dots:[{x:214,y:72}] },
    { char:"ط", arName:"طاء", enName:"Taa",   shape:TAA,  dots:[] },
    { char:"ظ", arName:"ظاء", enName:"Dhaa",  shape:TAA,  dots:[{x:215,y:73}] },
    { char:"ع", arName:"عين", enName:"Ain",   shape:AIN,  dots:[] },
    { char:"غ", arName:"غين", enName:"Ghain", shape:AIN,  dots:[{x:194,y:10}] },
    { char:"ف", arName:"فاء", enName:"Fa",    shape:FA,   dots:[{x:205,y:70}] },
    { char:"ق", arName:"قاف", enName:"Qaf",   shape:FA,   dots:[{x:195,y:70},{x:218,y:70}] },
    { char:"ك", arName:"كاف", enName:"Kaf",   shape:KAF,  dots:[] },
    { char:"ل", arName:"لام", enName:"Lam",   shape:LAM,  dots:[] },
    { char:"م", arName:"ميم", enName:"Meem",  shape:MEEM, dots:[] },
    { char:"ن", arName:"نون", enName:"Nun",   shape:BOWL, dots:[{x:160,y:85}] },
    { char:"هـ", arName:"هاء", enName:"Ha",    shape:HA,   dots:[] },
    { char:"و", arName:"واو", enName:"Waw",   shape:WAW,  dots:[] },
    { char:"ي", arName:"ياء", enName:"Ya",    shape:YAA, dots:[{x:145,y:225},{x:175,y:225}] }
  ];

  const LETTERS = RAW_LETTERS.map(l=>({
    char:l.char, arName:l.arName, enName:l.enName,
    guideDots: buildGuide(l.shape, 7),
    diacriticDots: l.dots.slice()
  }));

  /* ---------- state ---------- */
  const TOUCH_RADIUS = 20;
  const STRAY_THRESHOLD = 40;
  const STREAK_TARGET = 5;

  let currentIndex = 0;
  let continuousCorrect = 0;
  let mode = "tracing"; // "tracing" | "blank"
  let touchedGuide = [];
  let touchedDiacritic = [];
  let strokePoints = [];
  let isDrawing = false;
  let evalTimer = null;
  let locked = false; // true while a signal is showing

  /* ---------- dom refs ---------- */
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const canvasWrap = document.getElementById("canvasWrap");
  const bigChar = document.getElementById("bigChar");
  const namesLabel = document.getElementById("namesLabel");
  const idxLabel = document.getElementById("idxLabel");
  const modeBadge = document.getElementById("modeBadge");
  const streakDotsWrap = document.getElementById("streakDots");
  const streakLabel = document.getElementById("streakLabel");
  const instructionText = document.getElementById("instructionText");
  const signalCorrect = document.getElementById("signalCorrect");
  const signalWrong = document.getElementById("signalWrong");
  const backBtn = document.getElementById("backBtn");
  const nextBtn = document.getElementById("nextBtn");
  const clearBtn = document.getElementById("clearBtn");
  const checkBtn = document.getElementById("checkBtn");

  for(let i=0;i<STREAK_TARGET;i++){
    const d = document.createElement("div");
    d.className = "streak-dot";
    streakDotsWrap.appendChild(d);
  }
  const streakDotEls = Array.from(streakDotsWrap.children);

  /* ---------- rendering ---------- */
  function clearCanvas(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }

  function drawGuides(){
    const letter = LETTERS[currentIndex];
    if(mode !== "tracing") return;

    // dotted structural guide
    letter.guideDots.forEach((p,i)=>{
      const done = touchedGuide[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, i===0 ? 7 : 4.5, 0, Math.PI*2);
      ctx.fillStyle = i===0 ? "#1a56ff" : (done ? "#2fbf71" : "#c7cde0");
      ctx.fill();
    });

    // direction arrows every few points
    for(let i=0;i<letter.guideDots.length-1;i+=5){
      const a = letter.guideDots[i];
      const b = letter.guideDots[Math.min(i+1, letter.guideDots.length-1)];
      const ang = Math.atan2(b.y-a.y, b.x-a.x);
      const midx=(a.x+b.x)/2, midy=(a.y+b.y)/2;
      ctx.save();
      ctx.translate(midx, midy);
      ctx.rotate(ang);
      ctx.beginPath();
      ctx.moveTo(6,0); ctx.lineTo(-4,-4); ctx.lineTo(-4,4); ctx.closePath();
      ctx.fillStyle = "rgba(0,51,153,0.35)";
      ctx.fill();
      ctx.restore();
    }

    // diacritic dots (dots of the letter itself)
    letter.diacriticDots.forEach((p,i)=>{
      const done = touchedDiacritic[i];
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5.5, 0, Math.PI*2);
      ctx.fillStyle = done ? "#2fbf71" : "#7c86b8";
      ctx.fill();
    });
  }

  function drawUserStrokes(strokes){
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.strokeStyle = "#1a1a2e";
    ctx.lineWidth = 6;
    strokes.forEach(stroke=>{
      if(stroke.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(stroke[0].x, stroke[0].y);
      for(let i=1;i<stroke.length;i++){ ctx.lineTo(stroke[i].x, stroke[i].y); }
      ctx.stroke();
    });
  }

  let allStrokes = [];
  let currentStroke = [];

  function redraw(){
    clearCanvas();
    drawGuides();
    drawUserStrokes(allStrokes.concat(currentStroke.length ? [currentStroke] : []));
  }

  /* ---------- letter load / UI sync ---------- */
  function loadLetter(index, resetStreak){
    currentIndex = (index + LETTERS.length) % LETTERS.length;
    if(resetStreak){
      continuousCorrect = 0;
      mode = "tracing";
    }
    resetAttempt();
    const l = LETTERS[currentIndex];
    bigChar.textContent = l.char;
    namesLabel.innerHTML = "<b>"+l.enName+"</b> · "+l.arName;
    idxLabel.textContent = (currentIndex+1)+" / "+LETTERS.length;
    updateModeUI();
    updateStreakUI();
    redraw();
  }

  function resetAttempt(){
    const l = LETTERS[currentIndex];
    touchedGuide = new Array(l.guideDots.length).fill(false);
    touchedDiacritic = new Array(l.diacriticDots.length).fill(false);
    allStrokes = [];
    currentStroke = [];
    strokePoints = [];
    clearTimeout(evalTimer);
  }

  function updateModeUI(){
    if(mode === "blank"){
      modeBadge.textContent = "BLANK MODE";
      modeBadge.className = "mode-badge blank";
      instructionText.textContent = "No guides this time — draw " + LETTERS[currentIndex].enName + " from memory!";
    } else {
      modeBadge.textContent = "TRACING MODE";
      modeBadge.className = "mode-badge tracing";
      instructionText.textContent = "Trace over the dotted guide, starting from the blue dot.";
    }
  }

  function updateStreakUI(){
    streakDotEls.forEach((d,i)=>{
      d.classList.toggle("filled", i < continuousCorrect);
    });
    streakLabel.textContent = Math.min(continuousCorrect,STREAK_TARGET) + " / " + STREAK_TARGET + " correct in a row";
  }

  /* ---------- coordinate mapping ---------- */
  function toCanvasCoords(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
  }

  /* ---------- touch-all-dots tracking ---------- */
  function registerPoint(p){
    strokePoints.push(p);
    const l = LETTERS[currentIndex];
    l.guideDots.forEach((g,i)=>{
      if(!touchedGuide[i] && dist(p,g) <= TOUCH_RADIUS) touchedGuide[i] = true;
    });
    l.diacriticDots.forEach((g,i)=>{
      if(!touchedDiacritic[i] && dist(p,g) <= TOUCH_RADIUS) touchedDiacritic[i] = true;
    });
  }

  function nearestGuideDist(p){
    const l = LETTERS[currentIndex];
    let best = Infinity;
    l.guideDots.forEach(g=>{ const d=dist(p,g); if(d<best) best=d; });
    l.diacriticDots.forEach(g=>{ const d=dist(p,g); if(d<best) best=d; });
    return best;
  }

  /* ---------- pointer handling ---------- */
  function pointerDown(e){
    if(locked) return;
    isDrawing = true;
    clearTimeout(evalTimer);
    const pos = toCanvasCoords(e.clientX, e.clientY);
    currentStroke = [pos];
    registerPoint(pos);
    redraw();
    e.preventDefault();
  }
  function pointerMove(e){
    if(!isDrawing || locked) return;
    const pos = toCanvasCoords(e.clientX, e.clientY);
    currentStroke.push(pos);
    registerPoint(pos);
    redraw();
    e.preventDefault();
  }
  function pointerUp(e){
    if(!isDrawing) return;
    isDrawing = false;
    if(currentStroke.length > 1){ allStrokes.push(currentStroke); }
    currentStroke = [];
    redraw();
    evalTimer = setTimeout(evaluateAttempt, 1900);
  }

  canvas.addEventListener("pointerdown", pointerDown);
  canvas.addEventListener("pointermove", pointerMove);
  window.addEventListener("pointerup", pointerUp);
  canvas.addEventListener("pointercancel", pointerUp);

  /* ---------- evaluation ---------- */
  function evaluateAttempt(){
    if(locked) return;
    if(strokePoints.length === 0) return; // nothing drawn, don't judge

    const l = LETTERS[currentIndex];
    const allGuideTouched = touchedGuide.every(Boolean);
    const allDiacriticTouched = touchedDiacritic.every(Boolean);

    let strayed = false;
    if(mode === "tracing" && (l.guideDots.length || l.diacriticDots.length)){
      strayed = strokePoints.some(p => nearestGuideDist(p) > STRAY_THRESHOLD);
    }

    const correct = allGuideTouched && allDiacriticTouched && !strayed;
    showSignal(correct);
  }

  function showSignal(correct){
    locked = true;
    const el = correct ? signalCorrect : signalWrong;
    el.classList.add("show");

    if(correct){
      continuousCorrect++;
    } else {
      continuousCorrect = 0;
    }
    mode = continuousCorrect >= STREAK_TARGET ? "blank" : "tracing";
    updateStreakUI();

    setTimeout(()=>{
      el.classList.remove("show");
      locked = false;
      resetAttempt();
      updateModeUI();
      redraw();
    }, 1000);
  }

  /* ---------- controls ---------- */
  backBtn.addEventListener("click", ()=> loadLetter(currentIndex - 1, true));
  nextBtn.addEventListener("click", ()=> loadLetter(currentIndex + 1, true));
  clearBtn.addEventListener("click", ()=>{
    if(locked) return;
    clearTimeout(evalTimer);
    resetAttempt();
    redraw();
  });
  checkBtn.addEventListener("click", ()=>{
    if(locked) return;
    clearTimeout(evalTimer);
    evaluateAttempt();
  });

  /* ---------- init ---------- */
  loadLetter(0, true);

})();
</script>
</body>
</html>
