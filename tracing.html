<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>تعلّم الحروف — Arabic Letter Tracer</title>

<style>
  :root{
    --blue:#003399;
    --blue-dark:#002266;
    --paper:#f4f6fb;
    --card:#ffffff;
    --ink:#1a1a2e;
    --muted:#7a80a0;
    --guide:#c7cde0;
    --good:#1fa15b;
    --bad:#d13b3b;
    --gold:#f2b705;
  }

  *{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
  }

  html,body{
    height:100%;
  }

  body{
    margin:0;
    min-height:100%;

    background:linear-gradient(
      180deg,
      #e7ebf7 0%,
      var(--paper) 220px
    );

    font-family:
      "Segoe UI",
      "Tahoma",
      -apple-system,
      BlinkMacSystemFont,
      sans-serif;

    display:flex;
    align-items:flex-start;
    justify-content:center;

    padding:18px 12px 40px;
    color:var(--ink);
  }

  .app{
    width:100%;
    max-width:400px;
  }

  .card{
    background:var(--card);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,25,90,0.14);
  }

  header{
    background:
      linear-gradient(
        160deg,
        var(--blue) 0%,
        var(--blue-dark) 100%
      );

    color:#fff;
    padding:16px 14px 20px;
    text-align:center;
  }

  .nav-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }

  .nav-btn{
    width:42px;
    height:42px;
    border-radius:50%;
    border:none;

    background:rgba(255,255,255,0.16);
    color:#fff;

    font-size:20px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:
      transform .12s ease,
      background .15s ease;
  }

  .nav-btn:active{
    transform:scale(0.9);
    background:rgba(255,255,255,0.32);
  }

  .letter-meta{
    flex:1;
  }

  .letter-meta .idx{
    font-size:11px;
    letter-spacing:1px;
    color:#c9d3f5;
    margin-bottom:2px;
  }

  .letter-meta .names{
    font-size:14px;
    color:#e6ebff;
  }

  .letter-meta .names b{
    color:#fff;
    font-weight:600;
  }

  .big-char{
    font-size:64px;
    line-height:1;
    margin:10px 0 2px;
    font-weight:400;
  }

  .streak-wrap{
    margin-top:14px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:6px;
  }

  .streak-dot{
    width:11px;
    height:11px;
    border-radius:50%;

    background:rgba(255,255,255,0.25);

    transition:
      background .2s ease,
      transform .2s ease;
  }

  .streak-dot.filled{
    background:var(--gold);
    transform:scale(1.15);
  }

  .streak-label{
    font-size:11px;
    color:#c9d3f5;
    margin-top:8px;
    letter-spacing:.3px;
  }

  .mode-badge{
    display:inline-block;
    margin-top:8px;

    padding:4px 12px;

    border-radius:20px;

    font-size:11px;
    font-weight:600;

    letter-spacing:.4px;
  }

  .mode-badge.tracing{
    background:rgba(255,255,255,0.18);
    color:#fff;
  }

  .mode-badge.blank{
    background:var(--gold);
    color:#3a2900;
  }

  .body-area{
    padding:16px 16px 18px;
  }

  .instruction{
    text-align:center;

    font-size:13.5px;
    color:var(--muted);

    margin:0 0 12px;

    min-height:18px;
  }

  .canvas-wrap{
    position:relative;

    width:100%;

    border-radius:16px;

    background:
      repeating-linear-gradient(
        90deg,
        rgba(0,51,153,0.05) 0 1px,
        transparent 1px 100%
      );

    background-color:#fbfcff;

    border:2px solid #e3e7f5;

    touch-action:none;

    overflow:hidden;

    transition:
      border-color .2s ease,
      box-shadow .2s ease,
      transform .2s ease;
  }

  .canvas-wrap.correct{
    border-color:var(--good);

    box-shadow:
      0 0 0 3px rgba(31,161,91,0.12);
  }

  .canvas-wrap.wrong{
    border-color:var(--bad);

    box-shadow:
      0 0 0 3px rgba(209,59,59,0.12);
  }

  canvas{
    display:block;
    width:100%;
    height:auto;
  }

  .controls{
    display:flex;
    gap:10px;
    margin-top:14px;
  }

  .ctrl-btn{
    flex:1;

    border:none;
    border-radius:14px;

    padding:12px 8px;

    font-size:14px;
    font-weight:600;

    cursor:pointer;

    transition:
      transform .1s ease,
      filter .15s ease;
  }

  .ctrl-btn:active{
    transform:scale(0.97);
  }

  .ctrl-btn.clear{
    background:#eef1fb;
    color:var(--blue);
  }

  .ctrl-btn.check{
    background:var(--blue);
    color:#fff;
  }

  .ctrl-btn.clear:hover,
  .ctrl-btn.check:hover{
    filter:brightness(1.05);
  }

  .footnote{
    text-align:center;

    font-size:11px;

    color:#a7acc4;

    margin-top:14px;

    line-height:1.5;
  }

  @media (max-width:360px){

    .big-char{
      font-size:54px;
    }

  }
</style>
</head>

<body>

<div class="app">

  <div class="card">

    <header>

      <div class="nav-row">

        <button
          class="nav-btn"
          id="nextBtn"
          aria-label="التالي"
          title="Next letter">
          →
        </button>

        <div class="letter-meta">

          <div

            1 / 28

          <div

      </div>

      <div

        أ
      </div>

      <div
        class="mode-badge tracing"

        TRACING MODE
      </div>

      <div
        class="streak-wrap"
        id="streakDots">
      </div>

      <div
        class="streak-label"
        id="streakLabel">
        0 / 5 correct in a row
      </div>

    </header>


    <div class="body-area">

      <p
        class="instruction"
        id="instructionText">
        Trace over the dotted guide, starting from the blue dot.
      </p>


      <div
        class="canvas-wrap"
        id="canvasWrap">

        <canvas
          id="board"
          width="320"
          height="240">
        </canvas>

      </div>


      <div class="controls">

        <button
          class="ctrl-btn clear"
          id="clearBtn">
          Clear
        </button>

        <button
          class="ctrl-btn check"
          id="checkBtn">
          Check ✓
        </button>

      </div>


      <p class="footnote">
        Draw the letter with your finger or mouse.
        Get 5 correct in a row to unlock Blank Mode —
        one mistake sends you back to the guided dots.
      </p>

    </div>

  </div>

</div>

  function lerp(a,b,t){

  function ptOnSeg(seg,t){

    if(seg.p1){

      const x =
        (1-t)*(1-t)*seg.p0.x +
        2*(1-t)*t*seg.p1.x +
        t*t*seg.p2.x;

      const y =
        (1-t)*(1-t)*seg.p0.y +
        2*(1-t)*t*seg.p1.y +
        t*t*seg.p2.y;

      return {x,y};
    }

    return {
      x:lerp(seg.p0.x,seg.p2.x,t),
      y:lerp(seg.p0.y,seg.p2.y,t)
    };
  }


  function buildGuide(segments,perSeg){

    perSeg = perSeg || 7;

    const pts = [];

    segments.forEach(seg=>{

      for(let i=0;i<=perSeg;i++){

          ptOnSeg(
            seg,
            i/perSeg
          )
        );

      }

    });

    return pts;
  }

  const LETTERS =

  /* =========================================================
     STATE
     ========================================================= */

  const TOUCH_RADIUS = 20;

  const STRAY_THRESHOLD = 40;

  const STREAK_TARGET = 5;


  let currentIndex = 0;

  let continuousCorrect = 0;

  let mode = "tracing";

  let touchedGuide = [];

  let touchedDiacritic = [];

  let strokePoints = [];

  let isDrawing = false;

  let evalTimer = null;

  let locked = false;

  let allStrokes = [];

  let currentStroke = [];

  const canvas =

  /* =========================================================
     CANVAS RENDERING
     ========================================================= */

  function clearCanvas(){

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

  }


  function drawGuides(){

    const letter =
      LETTERS[currentIndex];


    /*
      BLANK MODE:
      Do NOT draw guide dots or letter guides.
    */

    if(mode !== "tracing"){
      return;
    }


    /* -------------------------
       DOTTED STRUCTURAL GUIDE
       ------------------------- */

    letter.guideDots.forEach(
      (p,i)=>{

        const done =
          touchedGuide[i];

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          i === 0 ? 7 : 4.5,
          0,
          Math.PI*2
        );

        ctx.fillStyle =
          i === 0
            ? "#1a56ff"
            : (
              done
                ? "#2fbf71"
                : "#c7cde0"
            );

        ctx.fill();

      }
    );


    /* -------------------------
       DIRECTION ARROWS
       ------------------------- */

    for(
      let i=0;
      i<letter.guideDots.length-1;
      i+=5
    ){

      const a =
        letter.guideDots[i];

      const b =
        letter.guideDots[
          Math.min(
            i+1,
            letter.guideDots.length-1
          )
        ];


      const ang =
        Math.atan2(
          b.y-a.y,
          b.x-a.x
        );


      const midx =
        (a.x+b.x)/2;

      const midy =
        (a.y+b.y)/2;


      ctx.save();

      ctx.translate(
        midx,
        midy
      );

      ctx.rotate(ang);

      ctx.beginPath();

      ctx.moveTo(6,0);

      ctx.lineTo(-4,-4);

      ctx.lineTo(-4,4);

      ctx.closePath();

      ctx.fillStyle =
        "rgba(0,51,153,0.35)";

      ctx.fill();

      ctx.restore();

    }


    /* -------------------------
       LETTER DOTS
       ------------------------- */

    letter.diacriticDots.forEach(
      (p,i)=>{

        const done =
          touchedDiacritic[i];

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          5.5,
          0,
          Math.PI*2
        );

        ctx.fillStyle =
          done
            ? "#2fbf71"
            : "#7c86b8";

        ctx.fill();

      }
    );

  }


  /* =========================================================
     UPDATED USER STROKE DRAWING
     
     IMPORTANT:
     A single point is now drawn as a black dot.
     ========================================================= */

  function drawUserStrokes(strokes){

    ctx.lineJoin =
      "round";

    ctx.lineCap =
      "round";

    ctx.strokeStyle =
      "#1a1a2e";

    ctx.fillStyle =
      "#1a1a2e";

    ctx.lineWidth =
      6;


    strokes.forEach(
      stroke=>{

        /*
          Ignore completely empty strokes.
        */

        if(!stroke || stroke.length === 0){
          return;
        }


        /*
          IMPORTANT FIX:

          If the user taps a dot with no movement,
          there is only ONE point.

          Previously this was ignored.

          Now it becomes a visible black dot.
        */

        if(stroke.length === 1){

          ctx.beginPath();

          ctx.arc(
            stroke[0].x,
            stroke[0].y,
            3,
            0,
            Math.PI*2
          );

          ctx.fill();

          return;
        }


        /*
          Normal handwriting stroke.
        */

        ctx.beginPath();

        ctx.moveTo(
          stroke[0].x,
          stroke[0].y
        );


        for(
          let i=1;
          i<stroke.length;
          i++
        ){

          ctx.lineTo(
            stroke[i].x,
            stroke[i].y
          );

        }


        ctx.stroke();

      }
    );

  }


  function redraw(){

    clearCanvas();


    /*
      Draw guide first.
    */

    drawGuides();


    /*
      Draw user's black writing AFTER guides.
    */

    drawUserStrokes(
      allStrokes.concat(
        currentStroke.length
          ? [currentStroke]
          : []
      )
    );

  }


  /* =========================================================
     LETTER LOADING
     ========================================================= */

  function loadLetter(
    index,
    resetStreak
  ){

    currentIndex =
      (
        index +
        LETTERS.length
      ) %
      LETTERS.length;


    if(resetStreak){

      continuousCorrect = 0;

      mode = "tracing";

    }


    resetAttempt();


    const l =
      LETTERS[currentIndex];


    bigChar.textContent =
      l.char;

      "<b>" +

    idxLabel.textContent =
      (
        currentIndex+1
      ) +
      " / " +
      LETTERS.length;


    updateModeUI();

    updateStreakUI();

    redraw();

  }


  function resetAttempt(){

    const l =
      LETTERS[currentIndex];


    touchedGuide =
      new Array(
        l.guideDots.length
      ).fill(false);


    touchedDiacritic =
      new Array(
        l.diacriticDots.length
      ).fill(false);


    allStrokes = [];

    currentStroke = [];

    strokePoints = [];

    clearTimeout(
      evalTimer
    );

  }


  function updateModeUI(){

    if(mode === "blank"){

      modeBadge.textContent =

  /* =========================================================
     COORDINATE MAPPING
     ========================================================= */

  function toCanvasCoords(
    clientX,
    clientY
  ){

    const rect =
      canvas.getBoundingClientRect();


    const scaleX =
      canvas.width /
      rect.width;


    const scaleY =
      canvas.height /
      rect.height;


    return {

      x:
        (clientX-rect.left) *
        scaleX,

      y:
        (clientY-rect.top) *
        scaleY

    };

  }


  /* =========================================================
     TRACING MODE DOT TRACKING
     ========================================================= */

  function registerPoint(p){

    strokePoints.push(p);


    const l =
      LETTERS[currentIndex];


    /*
      Main guide.
    */

    l.guideDots.forEach(
      (g,i)=>{

        if(
          !touchedGuide[i] &&
          dist(p,g) <= TOUCH_RADIUS
        ){

          touchedGuide[i] = true;

        }

      }
    );


    /*
      Separate dots.

      This works in BOTH tracing and blank mode.

      In blank mode these flags are not used
      for the final shape comparison, but we
      still track them.
    */

    l.diacriticDots.forEach(
      (g,i)=>{

        if(
          !touchedDiacritic[i] &&
          dist(p,g) <= TOUCH_RADIUS
        ){

          touchedDiacritic[i] = true;

        }

      }
    );

  }


  function nearestGuideDist(p){

    const l =
      LETTERS[currentIndex];


    let best =
      Infinity;


    l.guideDots.forEach(
      g=>{

        const d =
          dist(p,g);

        if(d < best){
          best = d;
        }

      }
    );


    l.diacriticDots.forEach(
      g=>{

        const d =
          dist(p,g);

        if(d < best){
          best = d;
        }

      }
    );


    return best;

  }


  /* =========================================================
     POINTER HANDLING
     ========================================================= */

  function pointerDown(e){

    if(locked){
      return;
    }


    isDrawing = true;

    clearTimeout(
      evalTimer
    );


    const pos =
      toCanvasCoords(
        e.clientX,
        e.clientY
      );


    /*
      IMPORTANT:

      Always start the stroke with one point.

      This means even a simple tap is stored.
    */

    currentStroke = [pos];


    registerPoint(pos);


    redraw();


    e.preventDefault();

  }


  function pointerMove(e){

    if(
      !isDrawing ||
      locked
    ){

      return;

    }


    const pos =
      toCanvasCoords(
        e.clientX,
        e.clientY
      );


    currentStroke.push(pos);

    registerPoint(pos);

    redraw();


    e.preventDefault();

  }


  /* =========================================================
     UPDATED POINTER UP
     
     IMPORTANT:
     Save even ONE-POINT strokes.
     ========================================================= */

  function pointerUp(e){

    if(!isDrawing){
      return;
    }


    isDrawing = false;


    /*
      IMPORTANT FIX:

      Previously:

        currentStroke.length > 1

      That caused a dot tap to disappear.

      Now:

        currentStroke.length > 0

      So a single tap becomes a saved stroke.
    */

    if(
      currentStroke.length > 0
    ){

      allStrokes.push(
        currentStroke
      );

    }


    currentStroke = [];


    redraw();


    /*
      Automatically check after the user
      stops drawing.
    */

    evalTimer =
      setTimeout(
        evaluateAttempt,
        1900
      );

  }


  canvas.addEventListener(
    "pointerdown",
    pointerDown
  );


  canvas.addEventListener(
    "pointermove",
    pointerMove
  );


  window.addEventListener(
    "pointerup",
    pointerUp
  );


  canvas.addEventListener(
    "pointercancel",
    pointerUp
  );


  /* =========================================================
     BLANK MODE
     POSITION-INDEPENDENT RECOGNITION
     ========================================================= */


  /*
    Get all user points.

    Includes:
      - normal strokes
      - single-point dot taps
  */

  function getUserPoints(){

    const points = [];


    allStrokes.forEach(
      stroke=>{

        stroke.forEach(
          p=>{

            points.push({

              x:p.x,
              y:p.y

            });

          }
        );

      }
    );


    currentStroke.forEach(
      p=>{

        points.push({

          x:p.x,
          y:p.y

        });

      }
    );


    return points;

  }


  /* =========================================================
     GET STROKE GROUPS
     ========================================================= */

  function getUserStrokes(){

    return allStrokes
      .filter(
        stroke =>
          stroke &&
          stroke.length > 0
      )
      .map(
        stroke =>
          stroke.map(
            p=>({
              x:p.x,
              y:p.y
            })
          )
      );

  }


  /* =========================================================
     NORMALIZE POINTS
     
     Removes absolute position and scale.
     ========================================================= */

  function normalizePoints(
    points
  ){

    if(
      !points ||
      points.length === 0
    ){

      return [];

    }


    let minX =
      Infinity;

    let minY =
      Infinity;

    let maxX =
      -Infinity;

    let maxY =
      -Infinity;


    points.forEach(
      p=>{

        minX =
          Math.min(
            minX,
            p.x
          );

        minY =
          Math.min(
            minY,
            p.y
          );

        maxX =
          Math.max(
            maxX,
            p.x
          );

        maxY =
          Math.max(
            maxY,
            p.y
          );

      }
    );


    const width =
      Math.max(
        maxX-minX,
        1
      );


    const height =
      Math.max(
        maxY-minY,
        1
      );


    return points.map(
      p=>({

        x:
          (p.x-minX) /
          width,

        y:
          (p.y-minY) /
          height

      })
    );

  }


  /* =========================================================
     RESAMPLE
     ========================================================= */

  function resamplePoints(
    points,
    count
  ){

    if(
      points.length <= count
    ){

      return points.slice();

    }


    const result = [];


    for(
      let i=0;
      i<count;
      i++
    ){

      const index =
        Math.floor(
          i *
          (points.length-1) /
          (count-1)
        );


      result.push(
        points[index]
      );

    }


    return result;

  }


  /* =========================================================
     NEAREST DISTANCE
     ========================================================= */

  function averageNearestDistance(
    source,
    target
  ){

    if(
      !source.length ||
      !target.length
    ){

      return Infinity;

    }


    let total = 0;


    source.forEach(
      p=>{

        let best =
          Infinity;


        target.forEach(
          q=>{

            const dx =
              p.x-q.x;

            const dy =
              p.y-q.y;


            const d =
              Math.sqrt(
                dx*dx +
                dy*dy
              );


            if(d < best){

              best = d;

            }

          }
        );


        total += best;

      }
    );


    return (
      total /
      source.length
    );

  }


  /* =========================================================
     GET REFERENCE BASE SHAPE
     ========================================================= */

  function getReferenceBasePoints(
    letter
  ){

    return letter.guideDots.map(
      p=>({

        x:p.x,

        y:p.y

      })
    );

  }


  /* =========================================================
     GET REFERENCE DOTS
     ========================================================= */

  function getReferenceDotPoints(
    letter
  ){

    return letter.diacriticDots.map(
      p=>({

        x:p.x,

        y:p.y

      })
    );

  }


  /* =========================================================
     FIND USER DOTS
     
     A dot is considered a separate small stroke
     when it contains very few points.
     ========================================================= */

  function getPossibleUserDotPoints(){

    const dots = [];


    allStrokes.forEach(
      stroke=>{

        if(
          !stroke ||
          stroke.length === 0
        ){

          return;

        }


        /*
          A direct tap is definitely a dot candidate.
        */

        if(
          stroke.length <= 3
        ){

          let sumX = 0;
          let sumY = 0;


          stroke.forEach(
            p=>{

              sumX += p.x;
              sumY += p.y;

            }
          );


          dots.push({

            x:
              sumX /
              stroke.length,

            y:
              sumY /
              stroke.length

          });

        }

      }
    );


    return dots;

  }


  /* =========================================================
     CHECK DOTS IN BLANK MODE
     
     Position is normalized relative to the user's
     complete drawing.
     ========================================================= */

  function checkBlankModeDots(
    letter,
    userAllPoints
  ){

    /*
      If the letter has no dots,
      nothing needs to be checked.
    */

    if(
      letter.diacriticDots.length === 0
    ){

      return true;

    }


    /*
      Find small independent user strokes.
    */

    const userDotPoints =
      getPossibleUserDotPoints();


    /*
      The user must make at least as many
      independent dot strokes as required.
    */

    if(
      userDotPoints.length <
      letter.diacriticDots.length
    ){

      return false;

    }


    /*
      Normalize the complete drawing
      so dot positions can be compared
      independent of board position and size.
    */

    const normalizedAll =
      normalizePoints(
        userAllPoints
      );


    /*
      Calculate original reference bounds.
    */

    const referenceBase =
      getReferenceBasePoints(
        letter
      );


    const referenceNormalized =
      normalizePoints(
        referenceBase
      );


    /*
      Reference bounding box is based on
      the main letter shape.
    */

    let refMinX = Infinity;
    let refMinY = Infinity;
    let refMaxX = -Infinity;
    let refMaxY = -Infinity;


    referenceBase.forEach(
      p=>{

        refMinX =
          Math.min(
            refMinX,
            p.x
          );

        refMinY =
          Math.min(
            refMinY,
            p.y
          );

        refMaxX =
          Math.max(
            refMaxX,
            p.x
          );

        refMaxY =
          Math.max(
            refMaxY,
            p.y
          );

      }
    );


    const refWidth =
      Math.max(
        refMaxX-refMinX,
        1
      );


    const refHeight =
      Math.max(
        refMaxY-refMinY,
        1
      );


    /*
      Convert reference dots to normalized
      positions relative to the base letter.
    */

    const normalizedReferenceDots =
      letter.diacriticDots.map(
        dot=>({

          x:
            (dot.x-refMinX) /
            refWidth,

          y:
            (dot.y-refMinY) /
            refHeight

        })
      );


    /*
      User overall bounds.
    */

    let userMinX = Infinity;
    let userMinY = Infinity;
    let userMaxX = -Infinity;
    let userMaxY = -Infinity;


    userAllPoints.forEach(
      p=>{

        userMinX =
          Math.min(
            userMinX,
            p.x
          );

        userMinY =
          Math.min(
            userMinY,
            p.y
          );

        userMaxX =
          Math.max(
            userMaxX,
            p.x
          );

        userMaxY =
          Math.max(
            userMaxY,
            p.y
          );

      }
    );


    const userWidth =
      Math.max(
        userMaxX-userMinX,
        1
      );


    const userHeight =
      Math.max(
        userMaxY-userMinY,
        1
      );


    /*
      Convert each user dot candidate
      into the same normalized coordinate system.
    */

    const normalizedUserDots =
      userDotPoints.map(
        dot=>({

          x:
            (dot.x-userMinX) /
            userWidth,

          y:
            (dot.y-userMinY) /
            userHeight

        })
      );


    /*
      Each reference dot needs a nearby
      user dot.

      We intentionally use a generous threshold
      because handwritten dots can be slightly
      displaced.
    */

    const DOT_THRESHOLD =
      0.22;


    const used =
      new Array(
        normalizedUserDots.length
      ).fill(false);


    for(
      const refDot of
      normalizedReferenceDots
    ){

      let found = false;


      for(
        let i=0;
        i<normalizedUserDots.length;
        i++
      ){

        if(used[i]){
          continue;
        }


        const userDot =
          normalizedUserDots[i];


        const d =
          Math.hypot(
            refDot.x-userDot.x,
            refDot.y-userDot.y
          );


        if(
          d <= DOT_THRESHOLD
        ){

          used[i] = true;

          found = true;

          break;

        }

      }


      if(!found){

        return false;

      }

    }


    return true;

  }


  /* =========================================================
     BLANK MODE SHAPE RECOGNITION
     ========================================================= */

  function recognizeBlankLetter(){

    const letter =
      LETTERS[currentIndex];


    const userPoints =
      getUserPoints();


    /*
      Need enough points for the main shape.
    */

    if(
      userPoints.length < 8
    ){

      return false;

    }


    /*
      ----------------------------------------
      MAIN LETTER SHAPE
      ----------------------------------------
    */

    const referenceBase =
      getReferenceBasePoints(
        letter
      );


    const userNormalized =
      normalizePoints(
        userPoints
      );


    const referenceNormalized =
      normalizePoints(
        referenceBase
      );


    const userSample =
      resamplePoints(
        userNormalized,
        120
      );


    const referenceSample =
      resamplePoints(
        referenceNormalized,
        120
      );


    const forward =
      averageNearestDistance(
        userSample,
        referenceSample
      );


    const reverse =
      averageNearestDistance(
        referenceSample,
        userSample
      );


    const finalDistance =
      (
        forward +
        reverse
      ) / 2;


    /*
      Bounding ratio.
    */

    function getBounds(points){

      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;


      points.forEach(
        p=>{

          minX =
            Math.min(
              minX,
              p.x
            );

          minY =
            Math.min(
              minY,
              p.y
            );

          maxX =
            Math.max(
              maxX,
              p.x
            );

          maxY =
            Math.max(
              maxY,
              p.y
            );

        }
      );


      return {

        width:
          maxX-minX,

        height:
          maxY-minY

      };

    }


    const userBounds =
      getBounds(
        userPoints
      );


    const referenceBounds =
      getBounds(
        referenceBase
      );


    const userRatio =
      userBounds.width /
      Math.max(
        userBounds.height,
        1
      );


    const referenceRatio =
      referenceBounds.width /
      Math.max(
        referenceBounds.height,
        1
      );


    const ratioDifference =
      Math.abs(
        userRatio-referenceRatio
      ) /
      Math.max(
        referenceRatio,
        0.1
      );


    const SHAPE_THRESHOLD =
      0.15;


    const RATIO_THRESHOLD =
      0.65;


    const mainShapeCorrect =
      finalDistance <=
      SHAPE_THRESHOLD;


    const ratioCorrect =
      ratioDifference <=
      RATIO_THRESHOLD;


    if(
      !mainShapeCorrect ||
      !ratioCorrect
    ){

      return false;

    }


    /*
      ----------------------------------------
      DOT CHECK
      ----------------------------------------

      This is the new important part.

      For:

        ب -> one dot
        ت -> two dots
        ث -> three dots
        ج -> one dot
        خ -> one dot
        ذ -> one dot
        ز -> one dot
        ش -> three dots
        ض -> one dot
        ظ -> one dot
        غ -> one dot
        ف -> one dot
        ق -> two dots
        ن -> one dot
        ي -> two dots

      the user must also provide the
      corresponding dot strokes.
    */

    const dotsCorrect =
      checkBlankModeDots(
        letter,
        userPoints
      );


    return dotsCorrect;

  }


  /* =========================================================
     TRACING MODE VALIDATION
     ========================================================= */

  function evaluateTracing(){

    const l =
      LETTERS[currentIndex];


    const allGuideTouched =
      touchedGuide.every(
        Boolean
      );


    const allDiacriticTouched =
      touchedDiacritic.every(
        Boolean
      );


    if(
      strokePoints.length === 0
    ){

      return false;

    }


    let strayed = false;


    if(
      l.guideDots.length ||
      l.diacriticDots.length
    ){

      strayed =
        strokePoints.some(
          p =>
            nearestGuideDist(p) >
            STRAY_THRESHOLD
        );

    }


    return (
      allGuideTouched &&
      allDiacriticTouched &&
      !strayed
    );

  }


  /* =========================================================
     EVALUATION
     ========================================================= */

  function evaluateAttempt(){

    if(locked){
      return;
    }


    if(
      strokePoints.length === 0 &&
      allStrokes.length === 0
    ){

      return;

    }


    /*
      =========================================
      BLANK MODE
      =========================================

      No fixed position.

      No guide touching requirement.

      Shape + dots are checked.
    */

    if(mode === "blank"){

      const correct =
        recognizeBlankLetter();


      showSignal(
        correct
      );


      return;

    }


    /*
      =========================================
      TRACING MODE
      =========================================
    */

    const correct =
      evaluateTracing();


    showSignal(
      correct
    );

  }


  /* =========================================================
     CORRECT / WRONG
     ========================================================= */

  function showSignal(
    correct
  ){

    locked = true;


    canvasWrap.classList.remove(
      "correct",
      "wrong"
    );


    canvasWrap.classList.add(
      correct
        ? "correct"
        : "wrong"
    );


    if(correct){

      continuousCorrect++;

    }
    else{

      continuousCorrect = 0;

    }


    /*
      Five correct in a row
      unlocks Blank Mode.
    */

    mode =
      continuousCorrect >=
      STREAK_TARGET

        ? "blank"

        : "tracing";


    updateStreakUI();


    setTimeout(
      ()=>{

        canvasWrap.classList.remove(
          "correct",
          "wrong"
        );


        locked = false;


        resetAttempt();


        updateModeUI();


        redraw();

      },
      3000
    );

  }


  /* =========================================================
     CONTROLS
     ========================================================= */

  backBtn.addEventListener(
    "click",
    ()=>{

      loadLetter(
        currentIndex-1,
        true
      );

    }
  );


  nextBtn.addEventListener(
    "click",
    ()=>{

      loadLetter(
        currentIndex+1,
        true
      );

    }
  );


  clearBtn.addEventListener(
    "click",
    ()=>{

      if(locked){
        return;
      }


      clearTimeout(
        evalTimer
      );


      resetAttempt();


      redraw();

    }
  );


  checkBtn.addEventListener(
    "click",
    ()=>{

      if(locked){
        return;
      }


      clearTimeout(
        evalTimer
      );


      evaluateAttempt();

    }
  );


  /* =========================================================
     PREVENT CONTEXT MENU
     ========================================================= */

  canvas.addEventListener(
    "contextmenu",
    e=>e.preventDefault()
  );


  /* =========================================================
     INITIALIZE
     ========================================================= */

  loadLetter(
    0,
    true
  );

})();

</script>
