<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعلّم الحروف — Arabic Letter Tracer</title>

<style>
:root{
  --blue:#003399;
  --blue-dark:#002266;
  --paper:#f4f6fb;
  --card:#ffffff;
  --ink:#1a1a2e;
  --muted:#7a80a0;
  --guide:#c7cde0;
  --good:#1fa15b;
  --bad:#d13b3b;
  --gold:#f2b705;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial, "Noto Sans Arabic", sans-serif;
  background:var(--paper);
  color:var(--ink);
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:20px;
}

.app{
  width:100%;
  max-width:600px;
}

header{
  background:var(--card);
  border-radius:20px;
  padding:18px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
  margin-bottom:15px;
}

.top-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.nav-btn{
  width:44px;
  height:44px;
  border-radius:12px;
  background:#eef1f8;
  color:var(--blue);
  font-size:22px;
  font-weight:bold;
}

.nav-btn:active{
  transform:scale(.95);
}

.list-btn{
  background:var(--blue);
  color:white;
  padding:11px 16px;
  border-radius:12px;
  font-weight:bold;
}

.title-area{
  text-align:center;
  flex:1;
}

.letter-number{
  color:var(--muted);
  font-size:13px;
  margin-bottom:3px;
}

.letter-name{
  font-size:18px;
  font-weight:bold;
}

.big-letter{
  font-size:72px;
  color:var(--blue);
  font-weight:bold;
  line-height:1;
  margin-top:10px;
}

.mode-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.mode-badge{
  display:inline-block;
  padding:6px 12px;
  border-radius:999px;
  background:#e9edff;
  color:var(--blue);
  font-size:12px;
  font-weight:bold;
}

.streak{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:13px;
}

.streak-dot{
  width:12px;
  height:12px;
  border-radius:50%;
  background:#d9ddea;
  transition:.2s;
}

.streak-dot.active{
  background:var(--gold);
  transform:scale(1.15);
}

.instruction{
  text-align:center;
  color:var(--muted);
  font-size:14px;
  margin-top:13px;
}

.canvas-card{
  background:var(--card);
  border-radius:20px;
  padding:15px;
  box-shadow:0 8px 30px rgba(0,0,0,.08);
}

.canvas-wrap{
  width:100%;
  max-width:520px;
  margin:auto;
  position:relative;
  border:4px solid transparent;
  border-radius:16px;
  overflow:hidden;
  transition:border-color .2s, box-shadow .2s;
  background:white;
}

.canvas-wrap.correct{
  border-color:var(--good);
  box-shadow:0 0 0 4px rgba(31,161,91,.12);
}

.canvas-wrap.wrong{
  border-color:var(--bad);
  box-shadow:0 0 0 4px rgba(209,59,59,.12);
}

canvas{
  display:block;
  width:100%;
  height:auto;
  background:white;
  touch-action:none;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:14px;
}

.control-btn{
  flex:1;
  padding:14px;
  border-radius:13px;
  font-size:16px;
  font-weight:bold;
}

.clear-btn{
  background:#eef1f8;
  color:var(--ink);
}

.check-btn{
  background:var(--blue);
  color:white;
}

.control-btn:active{
  transform:scale(.98);
}

.feedback{
  min-height:30px;
  text-align:center;
  font-weight:bold;
  margin-top:12px;
}

.feedback.correct{
  color:var(--good);
}

.feedback.wrong{
  color:var(--bad);
}

@media(max-width:500px){
  body{
    padding:10px;
  }

  header,
  .canvas-card{
    border-radius:16px;
  }

  .big-letter{
    font-size:64px;
  }

  .list-btn{
    padding:9px 12px;
    font-size:13px;
  }
}
</style>
</head>

<div class="app">

  <header>

    <div class="top-row">

      <button class="nav-btn" id="prevBtn" aria-label="Previous">
        →
      </button>

<script>

/* =========================================================
   LETTER DATA
========================================================= */

const RAW_LETTERS = [

const LETTERS = RAW_LETTERS.map((item,index)=>({
  char:item[0],
  english:item[1],
  arabic:item[2],
  number:String(index+1).padStart(2,"0")

/* =========================================================

========================================================= */

const canvas = document.getElementById("canvas");

const prevBtn = document.getElementById("prevBtn");

const streakDots =
  [...document.querySelectorAll(".streak-dot")];


/* =========================================================
   AUDIO
========================================================= */

/*
  Folder structure:

  your-project/
  │
  ├── your-html-file.html
  │
  └── audios/
      ├── error.mp3
      │
      └── arabic-letters/
          ├── 01.mp3
          ├── 02.mp3
          ├── 03.mp3
          ├── ...
          └── 28.mp3
*/

const errorAudio =
  new Audio("audios/error.mp3");

errorAudio.preload = "auto";


/* Preload all 28 Arabic letter sounds */

const letterAudios = LETTERS.map(letter => {

  const audio =
    new Audio(
      `audios/arabic-letters/${letter.number}.mp3`
    );

  audio.preload = "auto";

  return audio;
});


/* Play correct letter sound */

function playCorrectSound(){

  const audio =
    letterAudios[currentIndex];

  if(!audio) return;

  try{

    audio.pause();
    audio.currentTime = 0;

    const promise = audio.play();

    if(promise){
      promise.catch(error=>{
        console.warn(
          "Could not play letter audio:",
          error
        );
      });
    }

  }catch(error){

    console.warn(
      "Could not play letter audio:",
      error
    );

  }
}


/* Play error sound */

function playErrorSound(){

  try{

    errorAudio.pause();
    errorAudio.currentTime = 0;

    const promise =
      errorAudio.play();

    if(promise){

      promise.catch(error=>{
        console.warn(
          "Could not play error audio:",

        );
      });

    }

  }catch(error){

    console.warn(
      "Could not play error audio:",
      error
    );

  }
}


/* =========================================================
   EVALUATION CONSTANTS
========================================================= */

const TOUCH_RADIUS = 18;
const STRAY_THRESHOLD = 26;

const STREAK_TARGET = 5;

const DIACRITIC_TOUCH_RADIUS = 38;

const RESAMPLE_POINTS = 40;

const AVG_DEVIATION_LIMIT = 14;
const MAX_DEVIATION_LIMIT = 22;


/* =========================================================
   STATE
========================================================= */

let currentIndex = 0;

let continuousCorrect = 0;

let mode = "tracing";

let touchedGuide = false;

let touchedDiacritic = false;

let strokePoints = [];

let isDrawing = false;

let evalTimer = null;

let locked = false;

let guideTouchOrder = [];

let allStrokes = [];

let currentStroke = [];

let diacriticStrokeViolation = false;


/* =========================================================
   SHAPE DEFINITIONS
========================================================= */

const ALIF = [

const MEEM_ALT = [

];

const HA = [

  [205,100],
  [190,125],

];

const WAW = [

];

const YAA = [

];


/* =========================================================
   GUIDE MAP
========================================================= */

const guideMap = {

  "ا":[ALIF],

  "ب":[BOWL],

  "ت":[BOWL],

  "ث":[BOWL],

  "ج":[HOOK],

  "ح":[HOOK],

  "خ":[HOOK],

  "د":[DAL],

  "ذ":[DAL],

  "ر":[RA],

  "ز":[RA],

  "س":[SEEN],

  "ش":[SEEN],

  "ص":[SAAD],

  "ض":[SAAD],

  "ط":[TAA],

  "ظ":[TAA],

  "ع":[AIN],

  "غ":[AIN],

  "ف":[FA],

  "ق":[FA],

  "ك":[KAF_BODY,KAF_INNER],

  "ل":[LAM],

  "م":[MEEM],

  "ن":[BOWL],

  "هـ":[HA],

  "و":[WAW],

  "ي":[YAA]

};


/* =========================================================
   DRAW GUIDE
========================================================= */

function drawGuide(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const letter =
    LETTERS[currentIndex];

  const shapes =
    guideMap[letter.char] || [];


  if(mode === "blank"){

    ctx.fillStyle =
      "#003399";

    ctx.font =
      "bold 150px Arial";

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";

    ctx.fillText(
      letter.char,
      canvas.width / 2,
      canvas.height / 2 + 10
    );

    return;
  }


  ctx.lineWidth = 4;

  ctx.lineCap = "round";

  ctx.lineJoin = "round";

  ctx.strokeStyle =
    "#c7cde0";


  shapes.forEach(shape=>{

    if(!shape || shape.length < 2)
      return;

    ctx.beginPath();

    ctx.moveTo(
      shape[0][0],
      shape[0][1]
    );

    for(let i=1;i<shape.length;i++){

      ctx.lineTo(
        shape[i][0],
        shape[i][1]
      );

    }

    ctx.stroke();


    /* Guide dots */

    ctx.fillStyle =
      "#003399";

    shape.forEach(point=>{

      ctx.beginPath();

      ctx.arc(
        point[0],
        point[1],
        3,
        0,
        Math.PI * 2
      );

      ctx.fill();

    });

  });


  /* Add dots for letters with dots */

  if(
    ["ب","ت","ث","ن","ي","ف","ق","خ","ج","ذ","ز","ض","ظ","ش","غ"].includes(
      letter.char
    )
  ){

    drawLetterDots(letter.char);

  }

}


/* =========================================================
   LETTER DOTS
========================================================= */

function drawLetterDots(char){

  ctx.fillStyle =
    "#003399";

  let dots = [];


  switch(char){

    case "ب":
      dots = [[160,185]];
      break;

    case "ت":
      dots = [[145,85],[175,85]];
      break;

    case "ث":
      dots = [[135,80],[160,70],[185,80]];
      break;

    case "ن":
      dots = [[160,80]];
      break;

    case "ي":
      dots = [[145,185],[175,185]];
      break;

    case "ف":
      dots = [[160,85]];
      break;

    case "ق":
      dots = [[145,80],[175,80]];
      break;

    case "خ":
      dots = [[160,65]];
      break;

    case "ج":
      dots = [[160,175]];
      break;

    case "ذ":
      dots = [[160,65]];
      break;

    case "ز":
      dots = [[160,65]];
      break;

    case "ض":
      dots = [[160,70]];
      break;

    case "ظ":
      dots = [[160,65]];
      break;

    case "ش":
      dots = [
        [140,75],
        [160,65],
        [180,75]
      ];
      break;

    case "غ":
      dots = [[160,65]];
      break;

  }


  dots.forEach(point=>{

    ctx.beginPath();

    ctx.arc(
      point[0],
      point[1],
      5,
      0,
      Math.PI * 2
    );

    ctx.fill();

  });

}


/* =========================================================
   REDRAW
========================================================= */

function redraw(){

  drawGuide();

  if(allStrokes.length){

    ctx.strokeStyle =
      "#1a1a2e";

    ctx.lineWidth = 5;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";


    allStrokes.forEach(stroke=>{

      if(stroke.length < 2)
        return;

      ctx.beginPath();

      ctx.moveTo(
        stroke[0].x,
        stroke[0].y
      );

      for(let i=1;i<stroke.length;i++){

        ctx.lineTo(
          stroke[i].x,
          stroke[i].y
        );

      }

      ctx.stroke();

    });

  }

}


/* =========================================================
   POINTER POSITION
========================================================= */

function getPointerPosition(event){

  const rect =
    canvas.getBoundingClientRect();

  const scaleX =
    canvas.width / rect.width;

  const scaleY =
    canvas.height / rect.height;


  return {

    x:
      (event.clientX - rect.left) *
      scaleX,

    y:
      (event.clientY - rect.top) *
      scaleY

  };

}


/* =========================================================
   POINTER DOWN
========================================================= */

canvas.addEventListener(
  "pointerdown",
  event=>{

    if(locked)
      return;

    event.preventDefault();

    canvas.setPointerCapture(
      event.pointerId
    );

    isDrawing = true;

    currentStroke = [];

    const point =
      getPointerPosition(event);

    currentStroke.push(point);

    strokePoints.push(point);

    checkGuideTouch(point);

  }
);


/* =========================================================
   POINTER MOVE
========================================================= */

canvas.addEventListener(
  "pointermove",
  event=>{

    if(!isDrawing || locked)
      return;

    event.preventDefault();

    const point =
      getPointerPosition(event);

    currentStroke.push(point);

    strokePoints.push(point);

    checkGuideTouch(point);


    /* Draw user stroke */

    ctx.strokeStyle =
      "#1a1a2e";

    ctx.lineWidth = 5;

    ctx.lineCap = "round";

    ctx.lineJoin = "round";


    if(currentStroke.length >= 2){

      const a =
        currentStroke[
          currentStroke.length - 2
        ];

      const b =
        currentStroke[
          currentStroke.length - 1
        ];


      ctx.beginPath();

      ctx.moveTo(a.x,a.y);

      ctx.lineTo(b.x,b.y);

      ctx.stroke();

    }

  }
);


/* =========================================================
   POINTER UP
========================================================= */

canvas.addEventListener(
  "pointerup",
  event=>{

    if(!isDrawing)
      return;

    isDrawing = false;

    if(currentStroke.length > 1){

      allStrokes.push(
        [...currentStroke]
      );

    }

    currentStroke = [];

  }
);


canvas.addEventListener(
  "pointercancel",
  ()=>{
    isDrawing = false;
    currentStroke = [];
  }
);


/* =========================================================
   GUIDE TOUCH CHECK
========================================================= */

function checkGuideTouch(point){

  const letter =
    LETTERS[currentIndex];

  const shapes =
    guideMap[letter.char] || [];


  for(const shape of shapes){

    for(const guidePoint of shape){

      const dx =
        point.x - guidePoint[0];

      const dy =
        point.y - guidePoint[1];

      const distance =
        Math.sqrt(
          dx*dx + dy*dy
        );


      if(distance <= TOUCH_RADIUS){

        touchedGuide = true;

        guideTouchOrder.push(
          guidePoint
        );

        return;

      }

    }

  }

}


/* =========================================================
   DISTANCE
========================================================= */

function distance(a,b){

  const dx =
    a.x - b.x;

  const dy =
    a.y - b.y;

  return Math.sqrt(
    dx*dx + dy*dy
  );

}


/* =========================================================
   PATH DEVIATION
========================================================= */

function pathDeviation(
  stroke,
  guide
){

  if(
    !stroke.length ||
    !guide.length
  ){

    return {
      avg:999,
      max:999
    };

  }


  let total = 0;

  let max = 0;


  stroke.forEach(point=>{

    let closest =
      Infinity;


    guide.forEach(g=>{

      const dx =
        point.x - g[0];

      const dy =
        point.y - g[1];

      const d =
        Math.sqrt(
          dx*dx + dy*dy
        );

      if(d < closest)
        closest = d;

    });


    total += closest;

    if(closest > max)
      max = closest;

  });


  return {

    avg:
      total / stroke.length,

    max

  };

}


/* =========================================================
   RESAMPLE PATH
========================================================= */

function resamplePath(
  points,
  count
){

  if(points.length < 2)
    return points;


  const result = [];

  const totalLength =
    points.reduce(
      (sum,p,i)=>
        i === 0
        ? sum
        : sum + distance(
            points[i-1],
            p
          ),
      0
    );


  if(totalLength === 0)
    return points;


  const step =
    totalLength /
    (count - 1);


  result.push(points[0]);

  let accumulated = 0;

  let index = 1;


  for(
    let i=1;
    i<count-1;
    i++
  ){

    const target =
      step * i;


    while(
      index < points.length &&
      accumulated +
      distance(
        points[index-1],
        points[index]
      ) < target
    ){

      accumulated +=
        distance(
          points[index-1],
          points[index]
        );

      index++;

    }


    if(index >= points.length){

      result.push(
        points[points.length-1]
      );

      continue;

    }


    const prev =
      points[index-1];

    const curr =
      points[index];


    const segment =
      distance(prev,curr);


    const remaining =
      target - accumulated;


    const ratio =
      segment === 0
      ? 0
      : remaining / segment;


    result.push({

      x:
        prev.x +
        (curr.x-prev.x)*ratio,

      y:
        prev.y +
        (curr.y-prev.y)*ratio

    });

  }


  result.push(
    points[points.length-1]
  );


  return result;

}


/* =========================================================
   CHECK STRAY POINTS
========================================================= */

function hasStrayPoints(){

  const letter =
    LETTERS[currentIndex];

  const shapes =
    guideMap[letter.char] || [];


  for(const stroke of allStrokes){

    for(const point of stroke){

      let nearGuide = false;


      for(const shape of shapes){

        for(const g of shape){

          const dx =
            point.x - g[0];

          const dy =
            point.y - g[1];

          const d =
            Math.sqrt(
              dx*dx + dy*dy
            );


          if(d <= STRAY_THRESHOLD){

            nearGuide = true;
            break;

          }

        }

        if(nearGuide)
          break;

      }


      if(!nearGuide){

        /*
          Don't immediately fail blank mode
          because blank mode intentionally
          has no visible guide.
        */

        if(mode !== "blank")
          return true;

      }

    }

  }


  return false;

}


/* =========================================================
   DIRECTION CHECK
========================================================= */

function directionIsReasonable(
  stroke,
  guide
){

  if(
    stroke.length < 2 ||
    guide.length < 2
  )
    return true;


  const userStart =
    stroke[0];

  const userEnd =
    stroke[stroke.length-1];


  const guideStart = {
    x:guide[0][0],
    y:guide[0][1]
  };

  const guideEnd = {
    x:guide[guide.length-1][0],
    y:guide[guide.length-1][1]
  };


  const normal =
    distance(
      userStart,
      guideStart
    ) +
    distance(
      userEnd,
      guideEnd
    );


  const reverse =
    distance(
      userStart,
      guideEnd
    ) +
    distance(
      userEnd,
      guideStart
    );


  return normal <= reverse * 1.35;

}


/* =========================================================
   DOT CHECK
========================================================= */

function checkLetterDots(){

  const char =
    LETTERS[currentIndex].char;


  const dotted =
    [
      "ب","ت","ث",
      "ج","خ","ذ","ز",
      "ش","ض","ظ",
      "غ","ف","ق",
      "ن","ي"
    ];


  if(!dotted.includes(char))
    return true;


  /*
    For this implementation, the user must
    touch the general guide area.
  */

  return touchedGuide;

}


/* =========================================================
   SPECIAL KAF
========================================================= */

function evaluateKaf(){

  if(
    LETTERS[currentIndex].char !== "ك"
  )
    return true;


  if(allStrokes.length < 2)
    return false;


  const body =
    allStrokes[0];

  const inner =
    allStrokes[1];


  const bodyDeviation =
    pathDeviation(
      body,
      KAF_BODY
    );


  const innerDeviation =
    pathDeviation(
      inner,
      KAF_INNER
    );


  return (

    bodyDeviation.avg <=
      AVG_DEVIATION_LIMIT &&

    bodyDeviation.max <=
      MAX_DEVIATION_LIMIT &&

    innerDeviation.avg <=
      AVG_DEVIATION_LIMIT &&

    innerDeviation.max <=
      MAX_DEVIATION_LIMIT

  );

}


/* =========================================================
   MEEM
========================================================= */

function evaluateMeem(){

  if(
    LETTERS[currentIndex].char !== "م"
  )
    return true;


  if(!allStrokes.length)
    return false;


  const stroke =
    allStrokes[0];


  const normal =
    pathDeviation(
      stroke,
      MEEM
    );


  const alternate =
    pathDeviation(
      stroke,
      MEEM_ALT
    );


  const normalGood =
    normal.avg <= AVG_DEVIATION_LIMIT &&
    normal.max <= MAX_DEVIATION_LIMIT;


  const alternateGood =
    alternate.avg <= AVG_DEVIATION_LIMIT &&
    alternate.max <= MAX_DEVIATION_LIMIT;


  return normalGood || alternateGood;

}


/* =========================================================
   MAIN EVALUATION
========================================================= */

function evaluateAttempt(){

  if(locked)
    return;


  if(!allStrokes.length){

    showSignal(false);
    return;

  }


  /*
    Blank mode:
    When blank mode is active, use the
    Arabic character itself as the guide
    and allow the user to draw normally.
  */

  if(mode === "blank"){

    const userPoints =
      allStrokes.flat();


    if(userPoints.length < 5){

      showSignal(false);
      return;

    }


    const correct =
      evaluateBlankLetter(
        userPoints
      );


    showSignal(correct);

    return;

  }


  const letter =
    LETTERS[currentIndex];


  const shapes =
    guideMap[letter.char] || [];


  if(!shapes.length){

    showSignal(false);
    return;

  }


  if(hasStrayPoints()){

    showSignal(false);
    return;

  }


  if(!checkLetterDots()){

    showSignal(false);
    return;

  }


  if(!evaluateKaf()){

    showSignal(false);
    return;

  }


  if(!evaluateMeem()){

    showSignal(false);
    return;

  }


  /*
    For normal single-stroke letters,
    compare the longest user stroke
    against the guide.
  */

  let longestStroke =
    allStrokes[0];


  for(
    const stroke of allStrokes
  ){

    if(
      stroke.length >
      longestStroke.length
    ){

      longestStroke =
        stroke;

    }

  }


  const mainGuide =
    shapes[0];


  const resampledUser =
    resamplePath(
      longestStroke,
      RESAMPLE_POINTS
    );


  const deviation =
    pathDeviation(
      resampledUser,
      mainGuide
    );


  const deviationGood =
    deviation.avg <=
      AVG_DEVIATION_LIMIT &&

    deviation.max <=
      MAX_DEVIATION_LIMIT;


  const directionGood =
    directionIsReasonable(
      longestStroke,
      mainGuide
    );


  const correct =
    touchedGuide &&
    deviationGood &&
    directionGood;


  showSignal(correct);

}


/* =========================================================
   BLANK MODE EVALUATION
========================================================= */

function evaluateBlankLetter(
  points
){

  const letter =
    LETTERS[currentIndex];


  /*
    In blank mode, compare the user's
    stroke against the actual Arabic
    character rendered by the browser.

    A simplified bounding-box / coverage
    test is used here.
  */


  if(points.length < 8)
    return false;


  let minX = Infinity;
  let maxX = -Infinity;

  let minY = Infinity;
  let maxY = -Infinity;


  points.forEach(p=>{

    minX =
      Math.min(minX,p.x);

    maxX =
      Math.max(maxX,p.x);

    minY =
      Math.min(minY,p.y);

    maxY =
      Math.max(maxY,p.y);

  });


  const width =
    maxX - minX;

  const height =
    maxY - minY;


  /*
    Reject extremely tiny accidental strokes.
  */

  if(width < 25 && height < 25)
    return false;


  /*
    Compare against the guide shape
    when one exists.
  */

  const shapes =
    guideMap[letter.char] || [];


  if(shapes.length){

    let best =
      Infinity;


    shapes.forEach(shape=>{

      const result =
        pathDeviation(
          points,
          shape
        );


      best =
        Math.min(
          best,
          result.avg
        );

    });


    /*
      Blank mode is intentionally more
      forgiving than tracing mode.
    */

    return best <= 35;

  }


  return true;

}


/* =========================================================
   SHOW CORRECT / WRONG
========================================================= */

function showSignal(correct){

  locked = true;


  /* ============================================
     AUDIO FEEDBACK
  ============================================ */

  if(correct){

    /*
      Correct:
      01.mp3 for Alif
      02.mp3 for Ba
      03.mp3 for Ta
      ...
      28.mp3 for Ya
    */

    playCorrectSound();

  }else{

    /*
      Wrong:
      audios/error.mp3
    */

    playErrorSound();

  }


  /* ============================================
     VISUAL FEEDBACK
  ============================================ */

  canvasWrap.classList.remove(
    "correct",
    "wrong"
  );

  canvasWrap.classList.add(
    correct
      ? "correct"
      : "wrong"
  );


  feedback.classList.remove(
    "correct",
    "wrong"
  );


  feedback.classList.add(
    correct
      ? "correct"
      : "wrong"
  );


  feedback.textContent =
    correct
      ? "أحسنت! ✓"
      : "حاول مرة أخرى ✗";


  /* ============================================
     STREAK
  ============================================ */

  if(correct){

    continuousCorrect =
      Math.min(
        continuousCorrect + 1,
        STREAK_TARGET
      );

  }else{

    /*
      IMPORTANT:
      Any wrong answer resets the streak.
    */

    continuousCorrect = 0;

  }


  /*
    Five correct answers in a row
    unlocks blank mode.
  */

  mode =
    continuousCorrect >= STREAK_TARGET
      ? "blank"
      : "tracing";


  updateStreakUI();


  /* ============================================
     WAIT BEFORE RESET
  ============================================ */

  setTimeout(()=>{

    canvasWrap.classList.remove(
      "correct",
      "wrong"
    );

    feedback.classList.remove(
      "correct",
      "wrong"
    );

    feedback.textContent = "";


    locked = false;


    resetAttempt();

    updateModeUI();

    redraw();

  },3000);

}


/* =========================================================
   RESET ATTEMPT
========================================================= */

function resetAttempt(){

  allStrokes = [];

  currentStroke = [];

  strokePoints = [];

  touchedGuide = false;

  touchedDiacritic = false;

  guideTouchOrder = [];

  diacriticStrokeViolation = false;

  isDrawing = false;

}


/* =========================================================
   UPDATE STREAK UI
========================================================= */

function updateStreakUI(){

  streakDots.forEach(
    (dot,index)=>{

      dot.classList.toggle(
        "active",
        index < continuousCorrect
      );

    }
  );

}


/* =========================================================
   UPDATE MODE UI
========================================================= */

function updateModeUI(){

  if(mode === "blank"){

    modeBadge.textContent =
      "الوضع الحر";

    instruction.textContent =
      "اكتب الحرف من الذاكرة ثم اضغط تحقق";

  }else{

    modeBadge.textContent =
      "وضع التتبع";

    instruction.textContent =
      "تتبّع الحرف على النقاط ثم اضغط تحقق";

  }

}


/* =========================================================
   UPDATE LETTER UI
========================================================= */

function updateLetterUI(){

  const letter =
    LETTERS[currentIndex];


  letterNumber.textContent =
    `${letter.number} / ${LETTERS.length}`;


  letterName.textContent =
    letter.arabic;


  bigLetter.textContent =
    letter.char;


  updateModeUI();

  redraw();

}


/* =========================================================
   CLEAR BUTTON
========================================================= */

clearBtn.addEventListener(
  "click",
  ()=>{

    if(locked)
      return;

    resetAttempt();

    redraw();

  }
);


/* =========================================================
   CHECK BUTTON
========================================================= */

checkBtn.addEventListener(
  "click",
  ()=>{

    if(locked)
      return;

    evaluateAttempt();

  }
);


/* =========================================================
   PREVIOUS
========================================================= */

prevBtn.addEventListener(
  "click",
  ()=>{

    if(locked)
      return;


    currentIndex =
      (
        currentIndex -
        1 +
        LETTERS.length
      ) %
      LETTERS.length;


    /*
      Changing letter resets
      current attempt and streak.
    */

    continuousCorrect = 0;

    mode = "tracing";

    resetAttempt();

    updateStreakUI();

    updateLetterUI();

  }
);


/* =========================================================
   NEXT
========================================================= */

nextBtn.addEventListener(
  "click",
  ()=>{

    if(locked)
      return;


    currentIndex =
      (
        currentIndex +
        1
      ) %
      LETTERS.length;


    continuousCorrect = 0;

    mode = "tracing";

    resetAttempt();

    updateStreakUI();

    updateLetterUI();

  }
);


/* =========================================================
   LIST BUTTON
========================================================= */

listBtn.addEventListener(
  "click",
  ()=>{

    window.location.href =
      "learn-arabic-without-harakat.html";

  }
);


/* =========================================================
   AUDIO UNLOCK
   Helps mobile browsers allow audio.
========================================================= */

let audioUnlocked = false;


function unlockAudio(){

  if(audioUnlocked)
    return;

  audioUnlocked = true;


  /*
    We don't actually play the sounds here.
    We simply load them so the browser has
    them ready for the actual user action.
  */

  errorAudio.load();

  letterAudios.forEach(
    audio=>audio.load()
  );

}


/*
  First user interaction unlocks/preloads
  the audio resources.
*/

document.addEventListener(
  "pointerdown",
  unlockAudio,
  {once:true}
);


/* =========================================================
   INITIALIZE
========================================================= */

updateStreakUI();

updateLetterUI();

</script>
